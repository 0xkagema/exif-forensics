name: exifapp
description: "A cross-platform app to extract image details such as location, camera used to capture the image, whether the image was generated with AI etc"

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  exif: ^3.3.0
  toastification: ^3.2.0
  desktop_drop: ^0.7.1
  dotted_border: ^3.1.0
  image_picker: ^1.2.2
  flutter_osm_plugin: ^2.0.0+1
  google_fonts: ^8.1.0
  url_launcher: ^6.3.2
  flutter_launcher_icons: ^0.14.4
  font_awesome_flutter: ^11.0.0
  crypto: ^3.0.3
  rust_lib_exifapp:
    path: rust_builder
  flutter_rust_bridge: 2.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/logo.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/logo.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/logo.png"
